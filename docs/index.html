<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReadVeil</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f4ee;
        --text: #182030;
        --muted: #5c5a55;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #182030;
          --text: #f7f4ee;
          --muted: #b4b8c0;
        }
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ReadVeil</h1>
      <p>
        A Chrome extension that shows selected page text one segment at a time in
        a full-page overlay.
      </p>
      <p class="muted">
        Source and issues:
        <a href="https://github.com/tommy-truo/readveil">GitHub</a>
      </p>
      <p>
        <a href="./privacy/privacy-policy.html">Privacy policy</a>
      </p>
    </main>
  </body>
</html>
